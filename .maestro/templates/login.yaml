# Login flow template
#
# Cross-platform (iOS + Android). Copy to your project's .maestro/ directory and
# customize the appId, selectors, and test credentials.
#
# Run: maestro test .maestro/login.yaml

appId: ${MAESTRO_APP_ID:com.example.myapp}
name: Login flow
tags:
  - smoke
  - auth
---
- launchApp:
    clearState: true
    clearKeychain: true

- takeScreenshot: 00-launch

# Skip welcome carousel if present
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
      - waitForAnimationToEnd

- assertVisible: "Sign In"
- tapOn: "Sign In"
- waitForAnimationToEnd
- takeScreenshot: 01-sign-in-screen

# Customize these for your test credentials
- tapOn:
    id: "email-input"
- inputText: ${TEST_EMAIL:test@example.com}
- hideKeyboard

- tapOn:
    id: "password-input"
- inputText: ${TEST_PASSWORD:password123}
- hideKeyboard

- takeScreenshot: 02-credentials-entered

- tapOn:
    id: "submit-button"
- waitForAnimationToEnd

# After login, expect to land on home
- assertVisible: "Home"
  timeout: 10000
- takeScreenshot: 03-logged-in
